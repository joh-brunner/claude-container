# Codex configuration template.
# Copied to ~/.codex/config.toml on first container start (only if none exists).
# Edit the copy inside the container: nano ~/.codex/config.toml

# Model: gpt-5.6-sol (flagship), gpt-5.6-terra (balanced), gpt-5.6-luna (cheap),
# or gpt-6-astra (most capable, ~2.5x Sol's price, rollout may still be limited).
model = "gpt-5.6-sol"
model_reasoning_effort = "high"

# Stay below the 272K-token long-context price band for GPT-5.6.
model_auto_compact_token_limit = 260000

# Codex may only write inside the workspace, with no network from its sandbox.
sandbox_mode = "workspace-write"

# No explicit approval_policy: "untrusted" was retired in Codex 0.149.0 and now
# prevents Codex from starting. Strict approvals come from the project trust
# level below. Do NOT set approval_policy = "on-request"; it would override it.

[sandbox_workspace_write]
network_access = false

# Commands in this workspace require approval unless an execution-policy rule
# allows them (replacement for the retired approval_policy = "untrusted").
[projects."/workspace"]
trust_level = "untrusted"
